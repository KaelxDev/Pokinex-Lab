name: Sync Pokinex source into Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lab
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout current Pokinex source
        uses: actions/checkout@v4
        with:
          repository: KaelxDev/Pokinex
          ref: main
          path: upstream-pokinex
          fetch-depth: 1

      - name: Sync application source
        run: |
          rsync -a upstream-pokinex/backend/ backend/
          rsync -a upstream-pokinex/frontend/ frontend/

          rm -rf __sync_test.txt __probe.txt
          rm -f frontend/src/notifications-test.js
          rm -f .github/workflows/sync-pokinex-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backend frontend .github/workflows/sync-pokinex-once.yml __sync_test.txt __probe.txt
          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para sincronizar."
            exit 0
          fi

          git commit -m "sync: update Pokinex source into Lab"
          git push origin HEAD:main
