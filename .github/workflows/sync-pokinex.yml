name: Sync Pokinex Lab

on:
  push:
    paths:
      - '.github/workflows/sync-pokinex.yml'

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[sync-pokinex]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lab
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Pokinex source
        uses: actions/checkout@v4
        with:
          repository: KaelxDev/Pokinex
          ref: main
          path: .pokinex-source

      - name: Copy source files into lab
        shell: bash
        run: |
          set -euo pipefail

          SRC="$GITHUB_WORKSPACE/.pokinex-source"

          mkdir -p backend frontend

          cp -a "$SRC/backend/app/." backend/app/
          cp -a "$SRC/backend/.env.example" backend/.env.example
          cp -a "$SRC/backend/requirements.txt" backend/requirements.txt
          cp -a "$SRC/backend/requirements-dev.txt" backend/requirements-dev.txt 2>/dev/null || true
          cp -a "$SRC/backend/pyproject.toml" backend/pyproject.toml 2>/dev/null || true

          cp -a "$SRC/frontend/src/." frontend/src/
          cp -a "$SRC/frontend/public/." frontend/public/
          cp -a "$SRC/frontend/index.html" frontend/index.html
          cp -a "$SRC/frontend/package.json" frontend/package.json
          cp -a "$SRC/frontend/package-lock.json" frontend/package-lock.json
          cp -a "$SRC/frontend/vite.config.js" frontend/vite.config.js
          cp -a "$SRC/frontend/.env.example" frontend/.env.example 2>/dev/null || true
          cp -a "$SRC/frontend/ChatGPT Image 4_09_2026, 03_31_25.png" "frontend/ChatGPT Image 4_09_2026, 03_31_25.png" 2>/dev/null || true

          # Never carry generated local artifacts into the offline lab.
          find backend frontend -type d -name '__pycache__' -prune -exec rm -rf {} +
          rm -rf frontend/dist
          rm -rf .pokinex-source

      - name: Commit synchronized files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend frontend
          git rm -f .github/workflows/sync-pokinex.yml

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para sincronizar."
            exit 0
          fi

          git commit -m "chore: sync Pokinex updates to lab [sync-pokinex]"
          git push
